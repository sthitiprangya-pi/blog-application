<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSpace | My Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>BlogSpace</h1>
    <nav>
      <a href="#" onclick="showPage('home')">Home</a>
      <a href="#" onclick="showPage('login')">Login</a>
      <a href="#" onclick="showPage('register')">Register</a>
      <a href="#" onclick="showPage('dashboard')">Dashboard</a>
      <a href="#" onclick="showPage('create')">Create Blog</a>
    </nav>
  </header>

  <main>
    <!-- HOME PAGE -->
    <section id="home" class="page">
      <h2>Welcome to BlogSpace</h2>
      <p>Read stories, share ideas, and express yourself.</p>

      <h3>Latest Blog Posts</h3>
      <div id="blog-list" class="blog-list"></div>
    </section>

    <!-- LOGIN PAGE -->
    <section id="login" class="page hidden">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </section>

    <!-- REGISTER PAGE -->
    <section id="register" class="page hidden">
      <h2>Create an Account</h2>
      <form id="register-form">
        <input type="text" placeholder="Full name" required>
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Register</button>
      </form>
    </section>

    <!-- DASHBOARD PAGE -->
    <section id="dashboard" class="page hidden">
      <h2>My Dashboard</h2>
      <p>Manage your blog posts here.</p>
      <button onclick="showPage('create')">
        + Create New Blog
      </button>
      <div id="my-posts" class="blog-list"></div>
    </section>

    <!-- CREATE BLOG PAGE -->
    <section id="create" class="page hidden">
      <h2>Create a Blog Post</h2>
      <form id="blog-form">
        <input
          type="text"
          id="blog-title"
          placeholder="Enter blog title"
          required
        >

        <textarea
          id="blog-content"
          placeholder="Write your blog content..."
          rows="8"
          required
        ></textarea>

        <button type="submit">Publish Blog</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026  | Sthiti Prangya</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
